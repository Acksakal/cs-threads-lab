<script>
const VIEWS = ['explainer', 'play1', 'play2', 'play3'];
const PAIR = { life: 'play1', pool: 'play2', sem: 'play3' };
const BACK = { play1: 'life', play2: 'pool', play3: 'sem' };
const NAMES = { life: '① A Thread', pool: '② Thread pool', sem: '③ SemaphoreSlim' };
const loaded = {};
let current = null;

function decode(k) {
  const bin = atob(document.getElementById('d-' + k).textContent.trim());
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
function ensure(k) {
  return new Promise(res => {
    const f = document.getElementById('f-' + k);
    if (loaded[k]) return res(f);
    f.addEventListener('load', () => {
      loaded[k] = true;
      const d = f.contentDocument;
      d.addEventListener('keydown', onKey, true);
      d.addEventListener('click', () => setTimeout(updateJump, 50));
      res(f);
    }, { once: true });
    f.srcdoc = decode(k);
  });
}
async function show(k, then) {
  const f = await ensure(k);
  current = k;
  document.querySelectorAll('iframe').forEach(x => x.classList.toggle('on', x === f));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === k));
  history.replaceState(null, '', '#' + k);
  if (then) then(f.contentWindow);
  f.contentWindow.focus();
  updateJump();
}
function updateJump() {
  const b = document.getElementById('jump');
  if (!current) { b.hidden = true; return; }
  if (current === 'explainer') {
    const w = document.getElementById('f-explainer').contentWindow;
    const scn = w && w.eval ? w.eval('typeof cur !== "undefined" ? cur : "life"') : 'life';
    b.textContent = '▶ Watch ' + NAMES[scn] + ' as a play';
    b.onclick = () => show(PAIR[scn]);
  } else {
    const scn = BACK[current];
    b.textContent = '↩ Open ' + NAMES[scn] + ' in the explainer';
    b.onclick = () => show('explainer', w => { if (w.eval('cur') !== scn) w.load(scn); });
  }
  b.hidden = false;
}
function onKey(e) {
  if (e.altKey && /^[1-4]$/.test(e.key)) { e.preventDefault(); e.stopPropagation(); show(VIEWS[+e.key - 1]); }
}
document.addEventListener('keydown', onKey, true);
document.querySelectorAll('.tab').forEach(t => t.onclick = () => show(t.dataset.v));
const start = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'explainer';
show(start);
</script>
